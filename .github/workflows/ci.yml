name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine   # same as compose.yaml
        env:
          POSTGRES_USER: assisteai
          POSTGRES_PASSWORD: assisteai
          POSTGRES_DB: assisteai
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U assisteai -d assisteai"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://assisteai:assisteai@127.0.0.1:55432/assisteai
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14   # keep in sync with production

      - run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: Migrations are up to date with the schema
        run: bunx drizzle-kit check && bun run db:generate | grep -q 'No schema changes'

      - name: Migrate and seed
        run: bun run db:migrate && bun run db:seed

      - name: API tests
        env:
          CORS_ORIGINS: https://assisteai.com.br,https://beta2.assisteai.com.br
          GOOGLE_CLIENT_ID: ci-client.apps.googleusercontent.com
          GOOGLE_JWKS_URL: http://127.0.0.1:8080/www.googleapis.com/oauth2/v3/certs
          TMDB_API_TOKEN: ci-tmdb-token
          TMDB_API_URL: http://127.0.0.1:8080/api.themoviedb.org
          TELEGRAM_BOT_TOKEN: ci-bot-token
          TELEGRAM_CHAT_ID: '-1000000000000'
          TELEGRAM_API_URL: http://127.0.0.1:8080/api.telegram.org
        run: |
          bun run mock &
          bun run start &
          timeout 10 sh -c 'until curl -sf http://127.0.0.1:3000/health > /dev/null; do sleep 0.2; done'
          bun run test:api
