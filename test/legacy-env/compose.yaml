# Local copy of the legacy PHP API, the target of the contract suite before the new app exists.
# PHP app as in production + MariaDB 10.11 + a mock for every external API it calls (TMDb, Telegram, Google userinfo).
#
#   bun run legacy:up          # seeded with the contract dataset (test/fixtures/dataset.ts)
#   bun run legacy:down        # also drops the database, so the next `up` re-seeds it
#
# To explore production data instead: DUMP=/path/to/assisteai-full.sql.gz bun run legacy:up (after legacy:down).
# The legacy PHP repo is expected next to this one (../assisteai-back); override with LEGACY_APP_DIR.
#
# API: http://127.0.0.1:8000   MariaDB: 127.0.0.1:33306 (root/local)   Mock control: http://127.0.0.1:8080/__requests
name: assisteai-legacy

services:
  certs:
    image: alpine:3.20
    command: /bin/sh /scripts/certs.sh
    volumes:
      - ./certs.sh:/scripts/certs.sh:ro
      - certs:/certs

  seed:
    image: oven/bun:1.3.14
    working_dir: /repo
    command:
      - sh
      - -c
      - |
        rm -f /initdb/*
        if [ -s /dump.sql.gz ]; then cp /dump.sql.gz /initdb/10-seed.sql.gz
        else bun test/legacy-env/seed.ts > /initdb/10-seed.sql; fi
    volumes:
      - ../..:/repo:ro
      - ${DUMP:-/dev/null}:/dump.sql.gz:ro
      - initdb:/initdb

  mariadb:
    image: mariadb:10.11
    container_name: assisteai-mariadb
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      MARIADB_ROOT_PASSWORD: local
      MARIADB_DATABASE: assisteai
    ports:
      - 127.0.0.1:33306:3306
    volumes:
      - initdb:/docker-entrypoint-initdb.d:ro
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 90

  mock:
    image: oven/bun:1.3.14
    command: bun run /mock/server.ts
    depends_on:
      certs:
        condition: service_completed_successfully
    volumes:
      - ./mock:/mock:ro
      - certs:/certs:ro
    ports:
      - 127.0.0.1:8080:8080
    networks:
      default:
        aliases:
          - api.themoviedb.org
          - api.telegram.org
          - www.googleapis.com

  php:
    build:
      context: .
      dockerfile: php.Dockerfile
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    command: php -S 0.0.0.0:8000 -t public
    depends_on:
      mariadb:
        condition: service_healthy
      mock:
        condition: service_started
    volumes:
      - ${LEGACY_APP_DIR:-../../../assisteai-back}:/app
      - certs:/certs:ro
    ports:
      - 127.0.0.1:8000:8000
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/movies?page=1') === false ? 1 : 0);"]
      interval: 2s
      timeout: 5s
      retries: 30
    environment:
      # Mirrors the production .env (doc 01 §1); secrets are local dummies.
      APP_NAME: Assiste Aí - Backend
      APP_ENV: production
      APP_KEY: base64:bG9jYWwtbGVnYWN5LWVudi1ub3QtYS1yZWFsLWtleSE=
      APP_DEBUG: "false"
      APP_URL: https://api.assisteai.com.br
      APP_LOCALE: pt-BR
      APP_TIMEZONE: America/Sao_Paulo
      DB_TIMEZONE: America/Sao_Paulo
      # lcobucci/jwt refuses HS256 secrets shorter than 256 bits.
      JWT_SECRET: local-legacy-env-jwt-secret-must-be-at-least-256-bits-long-0123456789
      TMDB_API_KEY: local-tmdb-key
      GOOGLE_CLIENT_ID: local-google-client
      GOOGLE_CLIENT_SECRET: local-google-secret
      GOOGLE_CALLBACK_URL: http://localhost
      TELEGRAM_CHATID: "-1"
      TELEGRAM_TOKEN: local-telegram-token
      LOG_CHANNEL: stack
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: assisteai
      DB_USERNAME: root
      DB_PASSWORD: local
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync

volumes:
  certs:
  initdb:
  mariadb:
